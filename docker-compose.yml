services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: awlp
      POSTGRES_PASSWORD: awlp
      POSTGRES_DB: awlp
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w backend"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://awlp:awlp@postgres:5432/awlp?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  backend_node_modules:
