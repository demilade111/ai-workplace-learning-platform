services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: awlp
      POSTGRES_PASSWORD: awlp
      POSTGRES_DB: awlp
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: awlp
      MINIO_ROOT_PASSWORD: awlp12345
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w backend"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://awlp:awlp@postgres:5432/awlp?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: awlp
      S3_SECRET_KEY: awlp12345
      S3_BUCKET: documents
      S3_PUBLIC_URL: http://localhost:9002/documents
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres_data:
  backend_node_modules:
  minio_data:
